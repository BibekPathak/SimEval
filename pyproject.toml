[project]
name = "simeval"
version = "0.1.0"
description = "Simulation-driven robot learning evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SimEval Contributors" }]

dependencies = [
    "mujoco>=3.2.3,<4.0",
    "numpy>=1.26,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.35,<3.0",
    "alembic>=1.13,<2.0",
    "scipy>=1.14,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Optional: frame/video capture. Requires a working MuJoCo GL backend
# (glfw/egl/osmesa). Not required for metric computation or grading.
render = [
    "imageio>=2.34,<3.0",
    "imageio-ffmpeg>=0.5,<1.0",
]
torch = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "simulation"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "frontend", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
files = ["simulation", "backend/app"]
exclude = ["frontend", "datasets"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["simulation/tests", "backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
