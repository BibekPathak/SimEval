name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests, sim smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python \
            "mujoco>=3.2.3,<4.0" numpy \
            "fastapi>=0.115,<1.0" "uvicorn[standard]>=0.30,<1.0" \
            "pydantic>=2.9,<3.0" "pydantic-settings>=2.4,<3.0" \
            "sqlalchemy>=2.0.35,<3.0" "alembic>=1.13,<2.0" \
            "scipy>=1.14,<2.0" pyyaml httpx \
            "pytest>=8.3,<9.0" "ruff>=0.6,<1.0" "mypy>=1.11,<2.0"

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy (core interfaces)
        run: .venv/bin/mypy

      - name: Alembic migration upgrade/downgrade check
        env:
          SIMEVAL_DATABASE_URL: sqlite:///./_ci_mig.db
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base

      - name: Pytest
        run: .venv/bin/pytest

      - name: Simulator smoke test (headless)
        env:
          MUJOCO_GL: osmesa
        run: .venv/bin/python scripts/smoke_sim.py

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The frontend app is introduced in a later milestone. This job becomes
      # active once package.json exists; it no-ops otherwise.
      - name: Check for frontend app
        id: check
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.check.outputs.present == 'true'
        run: npm run typecheck --if-present
      - name: Build
        if: steps.check.outputs.present == 'true'
        run: npm run build
